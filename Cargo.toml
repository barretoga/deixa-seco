[package]
name = "deixa-seco"
version = "1.0.0"
license = "MIT"
description = "Windows disk space analyzer with a treemap view and cleanup suggestions"
repository = "https://github.com/barretoga/deixa-seco"
edition = "2024"

[dependencies]
eframe = "0.37.0"
jwalk = "0.9.0"
ntfs = "0.4.0"
rfd = "0.18.0"
trash = "5.4.0"
windows = { version = "0.62.2", features = ["ApplicationModel", "ApplicationModel_Core", "Foundation", "Foundation_Collections", "Management_Deployment", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Time", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
